<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#18202c" />
      <stop offset="55%" stop-color="#0c1017" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="35%" stop-color="#2563eb" />
      <stop offset="75%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="darkSteelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="35%" stop-color="#1e293b" />
      <stop offset="75%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <linearGradient id="alifTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>

    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <g filter="url(#dropShadow)">
    <polygon points="560,115 595,115 650,215 612,235 578,170 538,242 495,242" fill="url(#blueGrad)" stroke="#93c5fd" stroke-width="1.2" />
    <polygon points="578,170 612,235 545,235" fill="#0f172a" opacity="0.65" />
    <path d="M 465,335 C 505,245 585,255 645,212 L 645,245 C 585,288 525,280 502,335 Z" fill="url(#blueGrad)" stroke="#60a5fa" stroke-width="1" />
    <polygon points="495,242 538,242 502,335 462,335" fill="url(#darkSteelGrad)" stroke="#475569" stroke-width="1" />
    <polygon points="622,255 655,240 695,335 655,335" fill="url(#darkSteelGrad)" stroke="#475569" stroke-width="1" />
    <polygon points="670,132 708,115 708,148 670,165" fill="url(#blueGrad)" stroke="#93c5fd" stroke-width="1.2" />
    <polygon points="670,180 708,163 708,325 670,305" fill="url(#blueGrad)" stroke="#60a5fa" stroke-width="1.2" />
  </g>

  <g filter="url(#dropShadow)">
    <text x="600" y="435" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="4">
      <tspan fill="url(#alifTextGrad)">ALIF</tspan>
      <tspan fill="url(#silverGrad)"> IT CENTER</tspan>
    </text>
  </g>

  <g opacity="0.9">
    <line x1="340" y1="472" x2="395" y2="472" stroke="#3b82f6" stroke-width="2" />
    <text x="600" y="479" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="5" fill="#94a3b8">
      DIGITAL  |  INNOVATION  |  EXCELLENCE
    </text>
    <line x1="805" y1="472" x2="860" y2="472" stroke="#3b82f6" stroke-width="2" />
  </g>
